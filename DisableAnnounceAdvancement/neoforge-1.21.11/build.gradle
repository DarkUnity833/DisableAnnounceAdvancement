plugins {
    id 'java'
    id 'net.neoforged.moddev' version "${moddev_version}"
}
version = "${mod_version}-neoforge-${minecraft_version}"
group = 'dev.darkunity.announceadvancement'
base { archivesName = 'DisableAnnounceAdvancement' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

tasks.named('processResources') {
    var props = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = "${mod_version}-forge-${minecraft_version}"
group = 'dev.darkunity.announceadvancement'
base { archivesName = 'DisableAnnounceAdvancement' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        server { workingDirectory project.file('run'); property 'forge.logging.console.level', 'debug'
                 mods { "${mod_id}" { source sourceSets.main } } }
        client { workingDirectory project.file('run'); mods { "${mod_id}" { source sourceSets.main } } }
    }
}
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }

tasks.named('processResources') {
    var props = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}
tasks.named('jar') { finalizedBy 'reobfJar' }
